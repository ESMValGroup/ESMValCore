# Template: intake-esm catalog (NCI - on-disk access).
# Use `esmvaltool config copy data-intake-esm-nci.yml` to copy this example,
# then update the `catalog` path to an NCI catalog available on your system.
projects:
  CMIP6:
    data:
      nci-disk-catalog:
        type: esmvalcore.io.intake_esm.IntakeEsmDataSource
        facets:
          activity: "activity_id"
          dataset: "source_id"
          ensemble: "member_id"
          exp: "experiment_id"
          institute: "institution_id"
          grid: "grid_label"
          mip: "table_id"
          short_name: "variable_id"
          version: "version"
          timerange: "time_range"
        # Adjust if time_range values in your catalog use another separator.
        time_separator: "-"
        catalog: "/path/to/nci/intake-catalog.yml"
