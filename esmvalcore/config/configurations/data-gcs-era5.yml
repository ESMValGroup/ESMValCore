# Read ERA5 data in zarr format on Google Cloud Storage.
# Go to https://github.com/google-research/arco-era5 for further information.
projects:
  native6:
    data:
      gcs-era5-zarr:
        type: esmvalcore.io.xarray.XarrayDataSource
        # Local files and other data sources with the default priority (1) are
        # used first.
        priority: 10
        store: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
        options:
          chunks: "auto"
          engine: "zarr"
          storage_options:
            token: anon
        variables:
          tas: 2m_temperature
          pr: total_precipitation
        facets:
          dataset: "ERA5"
          frequency: "1hr"
