---
name: Test

permissions: {}

# runs on a push on main and at the end of every day
on:
  push:
    branches:
      - main
      - update-pixi
  schedule:
    - cron: "0 0 * * *" # nightly

defaults:
  run:
    shell: pixi run bash -e {0}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    if: github.repository == 'ESMValGroup/ESMValCore'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        environment:
          - test-py312
          - test-py313
          - test-py314
          - test-py315
          - test-r
    name: ${{ matrix.os }} ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          frozen: true
          environments: ${{ matrix.environment }}
      - name: Check dependencies are compatible
        run: pip check
      - name: Check code quality
        run: pre-commit run -a
      - name: Run tests
        run: pytest -n 2 --durations=10
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test_reports_${{ matrix.os }}_${{ matrix.environment }}
          path: test-reports
      - name: Check the command line interface
        run: |
          esmvaltool version
          esmvaltool -- --help
